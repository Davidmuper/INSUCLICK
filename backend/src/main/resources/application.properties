server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.example

# ==========================================
# Configuración Base de Datos PostgreSQL
# ==========================================
# Lee DB_URL, DB_USERNAME y DB_PASSWORD desde el archivo .env de la raíz.
# "optional:" significa que si .env no existe, se usan las variables de entorno del sistema.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Configuración ORM Hibernate / JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# El dialecto de PostgreSQL se detecta automáticamente (Hibernate avisaba que esta línea sobraba).

