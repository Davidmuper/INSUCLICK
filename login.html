<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — InsuClick</title>
  <link rel="icon" href="img/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <img src="img/insuclick.png" alt="InsuClick" class="auth-logo">
    <h2>Bienvenido de vuelta</h2>
    <p class="auth-subtitle">Ingresa a tu cuenta para continuar en InsuClick.</p>

    <div id="login-error" style="background:#FFF5F5;border:1px solid #FEB2B2;color:#C53030;
      border-radius:10px;padding:12px 16px;font-size:.88rem;margin-bottom:18px;display:none;">
    </div>

    <div class="mb-3">
      <label class="form-label">Correo electrónico</label>
      <input type="email" class="form-control" id="login-email" placeholder="correo@ejemplo.com" autocomplete="email">
      <div class="form-error">Ingresa un correo válido.</div>
    </div>

    <div class="mb-4">
      <label class="form-label">Contraseña</label>
      <div style="position:relative;">
        <input type="password" class="form-control" id="login-password" placeholder="Tu contraseña" autocomplete="current-password">
        <button onclick="togglePass('login-password', this)"
          style="position:absolute;right:14px;top:50%;transform:translateY(-50%);
          background:none;border:none;cursor:pointer;font-size:1.1rem;color:#A0AEC0;">👁</button>
      </div>
      <div class="form-error">La contraseña es obligatoria.</div>
    </div>

    <button class="btn-primary-ic w-100" style="height:52px;font-size:1rem;" onclick="doLogin()">
      Iniciar Sesión
    </button>

    <div class="auth-divider">o</div>

    <div class="auth-switch">
      ¿No tienes cuenta? <a href="registro.html">Regístrate gratis</a>
    </div>
    <div class="auth-switch mt-2">
      <a href="index.html" style="color:#A0AEC0;font-weight:500;">← Volver al inicio</a>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/ui.js"></script>
<script>
  // Si ya hay sesión, redirigir
  if (Auth.isLoggedIn()) {
    const u = Auth.currentUser();
    window.location.href = u.rol === 'vendedor' ? 'admin.html' : 'index.html';
  }

  function togglePass(id, btn) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
    btn.textContent = el.type === 'password' ? '👁' : '🙈';
  }

  function doLogin() {
    const emailEl = document.getElementById('login-email');
    const passEl  = document.getElementById('login-password');
    const errBox  = document.getElementById('login-error');
    errBox.style.display = 'none';

    let valid = true;
    if (!UI.validateField(emailEl, { required: true, email: true })) valid = false;
    if (!UI.validateField(passEl,  { required: true })) valid = false;
    if (!valid) return;

    const result = Auth.login({
      email: emailEl.value.trim(),
      password: passEl.value
    });

    if (!result.ok) {
      errBox.textContent = result.msg;
      errBox.style.display = 'block';
      return;
    }

    UI.toast(`¡Hola, ${result.user.nombre.split(' ')[0]}! Sesión iniciada.`, 'success');
    setTimeout(() => {
      window.location.href = result.user.rol === 'vendedor' ? 'admin.html' : 'index.html';
    }, 1000);
  }

  // Enter para login
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
